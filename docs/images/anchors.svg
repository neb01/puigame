<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="The nine anchor points of a rect">
  <title>The nine anchor points of a rect</title>
  <style>
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .text  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .muted { fill: #9da7b3; font-style: italic; }
    .parent { fill: #7aa2e0; fill-opacity: 0.14; stroke: #7aa2e0; stroke-width: 2; }
    .child  { fill: #f0b85a; fill-opacity: 0.20; stroke: #f0b85a; stroke-width: 1.5; }
    .dot    { fill: #ff6b66; stroke: #161b22; stroke-width: 1.5; }
    .margin { stroke: #4cc38a; stroke-width: 1.5; fill: none; }
    .mtext  { fill: #4cc38a; font-size: 12px; font-weight: 600; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="599" height="299" rx="8"/>
  <rect class="parent" x="130" y="60" width="340" height="190" rx="4"/>
  <text class="text small muted" x="140" y="80">reference rect</text>
  <circle class="dot" cx="130" cy="60" r="6"/>
  <text class="text label" x="130" y="46" text-anchor="middle">TOP_LEFT</text>
  <circle class="dot" cx="300" cy="60" r="6"/>
  <text class="text label" x="300" y="46" text-anchor="middle">MID_TOP</text>
  <circle class="dot" cx="470" cy="60" r="6"/>
  <text class="text label" x="470" y="46" text-anchor="middle">TOP_RIGHT</text>
  <circle class="dot" cx="130" cy="155" r="6"/>
  <text class="text label" x="116" y="159" text-anchor="end">MID_LEFT</text>
  <circle class="dot" cx="300" cy="155" r="6"/>
  <text class="text label" x="300" y="179" text-anchor="middle">CENTRE</text>
  <circle class="dot" cx="470" cy="155" r="6"/>
  <text class="text label" x="484" y="159" text-anchor="start">MID_RIGHT</text>
  <circle class="dot" cx="130" cy="250" r="6"/>
  <text class="text label" x="130" y="276" text-anchor="middle">BOTTOM_LEFT</text>
  <circle class="dot" cx="300" cy="250" r="6"/>
  <text class="text label" x="300" y="276" text-anchor="middle">MID_BOTTOM</text>
  <circle class="dot" cx="470" cy="250" r="6"/>
  <text class="text label" x="470" y="276" text-anchor="middle">BOTTOM_RIGHT</text>
</svg>

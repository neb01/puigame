<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img" aria-label="Placing a widget in three steps: anchors, margin, offset">
  <title>Placing a widget in three steps: anchors, margin, offset</title>
  <style>
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .text  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .muted { fill: #9da7b3; font-style: italic; }
    .parent { fill: #7aa2e0; fill-opacity: 0.14; stroke: #7aa2e0; stroke-width: 2; }
    .child  { fill: #f0b85a; fill-opacity: 0.20; stroke: #f0b85a; stroke-width: 1.5; }
    .ghost  { fill: none; stroke: #f0b85a; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.6; }
    .dot    { fill: #ff6b66; stroke: #161b22; stroke-width: 1.5; }
    .pdot   { fill: #c58af9; stroke: #161b22; stroke-width: 1.5; }
    .margin { stroke: #4cc38a; stroke-width: 1.8; fill: none; }
    .offset { stroke: #c58af9; stroke-width: 1.8; fill: none; }
    .mtext  { fill: #4cc38a; font-size: 12px; font-weight: 600; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .otext  { fill: #c58af9; font-size: 12px; font-weight: 600; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .wtext  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 11px; font-weight: 600; }
    .halo     { fill: #f0b85a; fill-opacity: 0.22; }
    .surface  { fill: none; stroke: #9da7b3; stroke-width: 1; stroke-dasharray: 2 3; }
    .border   { fill: #7aa2e0; }
    .body     { fill: #2b6e55; }
    .wrect    { fill: none; stroke: #ff6b66; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .sep      { stroke: #30363d; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4cc38a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c58af9"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="799" height="829" rx="8"/>
  <text class="text title" x="20" y="32" text-anchor="start">Placing a widget in three steps</text>
  <text class="text small muted" x="20" y="54" text-anchor="start">1. Match the anchor points.   2. Apply the margin towards the widget's centre.   3. Apply the offset in screen coordinates.</text>
  <text class="text label" x="150" y="80" text-anchor="middle">1. Match anchor points</text>
  <text class="mtext label" x="400" y="80" text-anchor="middle">2. Apply margin (green)</text>
  <text class="otext label" x="650" y="80" text-anchor="middle">3. Apply offset (purple)</text>
  <line class="sep" x1="20" y1="90" x2="780" y2="90"/>
  <text class="text small" x="25" y="108" text-anchor="start">anchor=TOP_LEFT, parent_anchor=BOTTOM_LEFT, margin=(24, 24), offset=(30, 0)</text>
  <text class="text small muted" x="25" y="125" text-anchor="start">Margin moves towards the widget's centre: right and down.</text>
  <rect class="parent" x="55" y="146" width="110" height="56" rx="4"/>
  <text class="text small muted" x="57" y="141" text-anchor="start">parent</text>
  <rect class="child" x="55" y="202" width="64" height="34" rx="3"/>
  <text class="wtext" x="87" y="223" text-anchor="middle">widget</text>
  <circle class="dot" cx="55" cy="202" r="4"/>
  <circle class="dot" cx="55" cy="202" r="4"/>
  <rect class="parent" x="305" y="146" width="110" height="56" rx="4"/>
  <text class="text small muted" x="307" y="141" text-anchor="start">parent</text>
  <rect class="ghost" x="305" y="202" width="64" height="34" rx="3"/>
  <rect class="child" x="329" y="226" width="64" height="34" rx="3"/>
  <text class="wtext" x="361" y="247" text-anchor="middle">widget</text>
  <line class="margin" x1="305" y1="202" x2="329" y2="226" marker-end="url(#ag)"/>
  <circle class="dot" cx="305" cy="202" r="4"/>
  <circle class="dot" cx="329" cy="226" r="4"/>
  <rect class="parent" x="555" y="146" width="110" height="56" rx="4"/>
  <text class="text small muted" x="557" y="141" text-anchor="start">parent</text>
  <rect class="ghost" x="579" y="226" width="64" height="34" rx="3"/>
  <rect class="child" x="609" y="226" width="64" height="34" rx="3"/>
  <text class="wtext" x="641" y="247" text-anchor="middle">widget</text>
  <line class="offset" x1="579" y1="226" x2="609" y2="226" marker-end="url(#ap)"/>
  <circle class="dot" cx="555" cy="202" r="4"/>
  <circle class="dot" cx="609" cy="226" r="4"/>
  <line class="sep" x1="20" y1="274" x2="780" y2="274"/>
  <text class="text small" x="25" y="292" text-anchor="start">anchor=TOP_RIGHT, parent_anchor=TOP_LEFT, margin=(24, 24), offset=(0, -24)</text>
  <text class="text small muted" x="25" y="309" text-anchor="start">Towards the widget's centre is left and down, so the margin moves it away from the parent.</text>
  <rect class="parent" x="155" y="350" width="110" height="56" rx="4"/>
  <text class="text small muted" x="157" y="345" text-anchor="start">parent</text>
  <rect class="child" x="91" y="350" width="64" height="34" rx="3"/>
  <text class="wtext" x="123" y="371" text-anchor="middle">widget</text>
  <circle class="dot" cx="155" cy="350" r="4"/>
  <circle class="dot" cx="155" cy="350" r="4"/>
  <rect class="parent" x="405" y="350" width="110" height="56" rx="4"/>
  <text class="text small muted" x="407" y="345" text-anchor="start">parent</text>
  <rect class="ghost" x="341" y="350" width="64" height="34" rx="3"/>
  <rect class="child" x="317" y="374" width="64" height="34" rx="3"/>
  <text class="wtext" x="349" y="395" text-anchor="middle">widget</text>
  <line class="margin" x1="405" y1="350" x2="381" y2="374" marker-end="url(#ag)"/>
  <circle class="dot" cx="405" cy="350" r="4"/>
  <circle class="dot" cx="381" cy="374" r="4"/>
  <rect class="parent" x="655" y="350" width="110" height="56" rx="4"/>
  <text class="text small muted" x="657" y="345" text-anchor="start">parent</text>
  <rect class="ghost" x="567" y="374" width="64" height="34" rx="3"/>
  <rect class="child" x="567" y="350" width="64" height="34" rx="3"/>
  <text class="wtext" x="599" y="371" text-anchor="middle">widget</text>
  <line class="offset" x1="631" y1="374" x2="631" y2="350" marker-end="url(#ap)"/>
  <circle class="dot" cx="655" cy="350" r="4"/>
  <circle class="dot" cx="631" cy="350" r="4"/>
  <line class="sep" x1="20" y1="458" x2="780" y2="458"/>
  <text class="text small" x="25" y="476" text-anchor="start">anchor=MID_TOP, parent_anchor=MID_BOTTOM, margin=(0, 20), offset=(30, 0)</text>
  <text class="text small muted" x="25" y="493" text-anchor="start">A tooltip below its parent: the y margin leaves a gap, and the offset shifts it right.</text>
  <rect class="parent" x="95" y="514" width="110" height="56" rx="4"/>
  <text class="text small muted" x="97" y="509" text-anchor="start">parent</text>
  <rect class="child" x="118" y="570" width="64" height="34" rx="3"/>
  <text class="wtext" x="150" y="591" text-anchor="middle">widget</text>
  <circle class="dot" cx="150" cy="570" r="4"/>
  <circle class="dot" cx="150" cy="570" r="4"/>
  <rect class="parent" x="345" y="514" width="110" height="56" rx="4"/>
  <text class="text small muted" x="347" y="509" text-anchor="start">parent</text>
  <rect class="ghost" x="368" y="570" width="64" height="34" rx="3"/>
  <rect class="child" x="368" y="590" width="64" height="34" rx="3"/>
  <text class="wtext" x="400" y="611" text-anchor="middle">widget</text>
  <line class="margin" x1="400" y1="570" x2="400" y2="590" marker-end="url(#ag)"/>
  <circle class="dot" cx="400" cy="570" r="4"/>
  <circle class="dot" cx="400" cy="590" r="4"/>
  <rect class="parent" x="595" y="514" width="110" height="56" rx="4"/>
  <text class="text small muted" x="597" y="509" text-anchor="start">parent</text>
  <rect class="ghost" x="618" y="590" width="64" height="34" rx="3"/>
  <rect class="child" x="648" y="590" width="64" height="34" rx="3"/>
  <text class="wtext" x="680" y="611" text-anchor="middle">widget</text>
  <line class="offset" x1="650" y1="590" x2="680" y2="590" marker-end="url(#ap)"/>
  <circle class="dot" cx="650" cy="570" r="4"/>
  <circle class="dot" cx="680" cy="590" r="4"/>
  <line class="sep" x1="20" y1="642" x2="780" y2="642"/>
  <text class="text small" x="25" y="660" text-anchor="start">anchor=CENTRE, parent_anchor=CENTRE, margin=(24, 24), offset=(0, -30)</text>
  <text class="text small muted" x="25" y="677" text-anchor="start">Margins have no direction at CENTRE, so only the offset moves the widget.</text>
  <rect class="parent" x="95" y="728" width="110" height="56" rx="4"/>
  <text class="text small muted" x="97" y="799" text-anchor="start">parent</text>
  <rect class="child" x="118" y="739" width="64" height="34" rx="3"/>
  <text class="wtext" x="123" y="752" text-anchor="start">widget</text>
  <circle class="dot" cx="150" cy="756" r="4"/>
  <circle class="dot" cx="150" cy="756" r="4"/>
  <rect class="parent" x="345" y="728" width="110" height="56" rx="4"/>
  <text class="text small muted" x="347" y="799" text-anchor="start">parent</text>
  <rect class="child" x="368" y="739" width="64" height="34" rx="3"/>
  <text class="wtext" x="373" y="752" text-anchor="start">widget</text>
  <circle class="dot" cx="400" cy="756" r="4"/>
  <circle class="dot" cx="400" cy="756" r="4"/>
  <rect class="parent" x="595" y="728" width="110" height="56" rx="4"/>
  <text class="text small muted" x="597" y="799" text-anchor="start">parent</text>
  <rect class="ghost" x="618" y="739" width="64" height="34" rx="3"/>
  <rect class="child" x="618" y="709" width="64" height="34" rx="3"/>
  <text class="wtext" x="623" y="722" text-anchor="start">widget</text>
  <line class="offset" x1="650" y1="756" x2="650" y2="726" marker-end="url(#ap)"/>
  <circle class="dot" cx="650" cy="756" r="4"/>
  <circle class="dot" cx="650" cy="726" r="4"/>
</svg>

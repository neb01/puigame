<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-label="Positive and negative margins, with the same and different anchors">
  <title>Positive and negative margins, with the same and different anchors</title>
  <style>
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .text  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .muted { fill: #9da7b3; font-style: italic; }
    .parent { fill: #7aa2e0; fill-opacity: 0.14; stroke: #7aa2e0; stroke-width: 2; }
    .child  { fill: #f0b85a; fill-opacity: 0.20; stroke: #f0b85a; stroke-width: 1.5; }
    .dot    { fill: #ff6b66; stroke: #161b22; stroke-width: 1.5; }
    .margin { stroke: #4cc38a; stroke-width: 1.5; fill: none; }
    .mtext  { fill: #4cc38a; font-size: 12px; font-weight: 600; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .guide  { stroke: #7aa2e0; stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.7; fill: none; }
    .wtext  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 12px; font-weight: 600; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="719" height="649" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4cc38a"/>
    </marker>
  </defs>
  <line x1="20" y1="320" x2="700" y2="320" stroke="#30363d" stroke-width="1"/>
  <text class="text label" x="30" y="34">Same anchor, positive margin</text>
  <rect class="parent" x="40" y="110" width="170" height="100" rx="4"/>
  <text class="text small muted" x="48" y="128">parent</text>
  <line class="margin" x1="170" y1="178" x2="210" y2="178" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="190" y="171" text-anchor="middle">x</text>
  <line class="margin" x1="122" y1="110" x2="122" y2="150" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="130" y="134" text-anchor="start">y</text>
  <rect class="child" x="74" y="150" width="96" height="56" rx="3"/>
  <text class="wtext" x="122" y="182" text-anchor="middle">widget</text>
  <circle class="dot" cx="210" cy="110" r="5"/>
  <circle class="dot" cx="170" cy="150" r="5"/>
  <text class="text small" x="30" y="250">anchor=TOP_RIGHT</text>
  <text class="text small" x="30" y="268">margin=40</text>
  <text class="text small" x="30" y="286">moves inwards</text>
  <text class="text label" x="390" y="34">Same anchor, negative margin</text>
  <rect class="parent" x="400" y="110" width="170" height="100" rx="4"/>
  <text class="text small muted" x="408" y="128">parent</text>
  <line class="guide" x1="570" y1="110" x2="570" y2="50"/>
  <line class="guide" x1="610" y1="70" x2="610" y2="50"/>
  <line class="margin" x1="570" y1="56" x2="610" y2="56" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="590" y="49" text-anchor="middle">−x</text>
  <line class="guide" x1="570" y1="110" x2="630" y2="110"/>
  <line class="guide" x1="610" y1="70" x2="630" y2="70"/>
  <line class="margin" x1="624" y1="70" x2="624" y2="110" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="632" y="94" text-anchor="start">−y</text>
  <rect class="child" x="514" y="70" width="96" height="56" rx="3"/>
  <text class="wtext" x="544" y="92" text-anchor="middle">widget</text>
  <circle class="dot" cx="570" cy="110" r="5"/>
  <circle class="dot" cx="610" cy="70" r="5"/>
  <text class="text small" x="390" y="250">anchor=TOP_RIGHT</text>
  <text class="text small" x="390" y="268">margin=-40</text>
  <text class="text small" x="390" y="286">overlaps the corner from outside</text>
  <text class="text label" x="30" y="354">Different anchors, positive margin</text>
  <rect class="parent" x="40" y="390" width="160" height="80" rx="4"/>
  <text class="text small muted" x="48" y="408">parent</text>
  <line class="guide" x1="200" y1="470" x2="200" y2="544"/>
  <line class="guide" x1="200" y1="470" x2="294" y2="470"/>
  <line class="margin" x1="200" y1="538" x2="240" y2="538" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="220" y="531" text-anchor="middle">x</text>
  <line class="margin" x1="288" y1="470" x2="288" y2="510" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="296" y="494" text-anchor="start">y</text>
  <rect class="child" x="240" y="510" width="96" height="56" rx="3"/>
  <text class="wtext" x="288" y="542" text-anchor="middle">widget</text>
  <circle class="dot" cx="200" cy="470" r="5"/>
  <circle class="dot" cx="240" cy="510" r="5"/>
  <text class="text small" x="30" y="592">anchor=TOP_LEFT, parent_anchor=BOTTOM_RIGHT</text>
  <text class="text small" x="30" y="610">margin=40</text>
  <text class="text small" x="30" y="628">moves outside the corner</text>
  <text class="text label" x="390" y="354">Different anchors, negative margin</text>
  <rect class="parent" x="400" y="390" width="160" height="80" rx="4"/>
  <text class="text small muted" x="408" y="408">parent</text>
  <line class="guide" x1="560" y1="470" x2="560" y2="506"/>
  <line class="guide" x1="520" y1="430" x2="520" y2="506"/>
  <line class="margin" x1="520" y1="500" x2="560" y2="500" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="540" y="493" text-anchor="middle">−x</text>
  <line class="guide" x1="560" y1="470" x2="636" y2="470"/>
  <line class="guide" x1="616" y1="430" x2="636" y2="430"/>
  <line class="margin" x1="630" y1="430" x2="630" y2="470" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="mtext" x="638" y="454" text-anchor="start">−y</text>
  <rect class="child" x="520" y="430" width="96" height="56" rx="3"/>
  <text class="wtext" x="590" y="482" text-anchor="middle">widget</text>
  <circle class="dot" cx="560" cy="470" r="5"/>
  <circle class="dot" cx="520" cy="430" r="5"/>
  <text class="text small" x="390" y="592">anchor=TOP_LEFT, parent_anchor=BOTTOM_RIGHT</text>
  <text class="text small" x="390" y="610">margin=-40</text>
  <text class="text small" x="390" y="628">overlaps the corner from inside</text>
</svg>

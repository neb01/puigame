version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # wait a week before proposing a new release, since compromised releases
    # are usually caught and pulled within days
    cooldown:
      default-days: 7
    # gives PR titles like "ci: bump …", which pass the "Check PR title" check
    commit-message:
      prefix: ci
    # one PR for all action updates instead of one each
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # update only uv.lock, so pyproject.toml's lower bounds (the supported
    # floors users rely on, such as pygame-ce>=2.5.8) are never raised
    versioning-strategy: lockfile-only
    # gives PR titles like "build: bump …", which pass the "Check PR title" check
    commit-message:
      prefix: build
    # one PR for all uv.lock updates instead of one each
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # gives PR titles like "build: bump …", which pass the "Check PR title" check
    commit-message:
      prefix: build
    # one PR for all hook updates instead of one each
    groups:
      pre-commit:
        patterns: ["*"]

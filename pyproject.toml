[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.21,<0.13" ]

[project]
name = "puigame"
version = "0.0.1"
description = "UI widgets for pygame-ce"
readme = "README.md"
keywords = [ "game-development", "gui", "pygame", "pygame-ce", "ui", "widgets" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "neb01", email = "69682096+neb01@users.noreply.github.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: pygame",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "pygame-ce>=2.5.8",
]
urls.Issues = "https://github.com/neb01/puigame/issues"
urls.Repository = "https://github.com/neb01/puigame"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
src = [ "src", "tests" ]
format.docstring-code-format = true
lint.select = [
  "B",   # flake8-bugbear (common bug patterns)
  "D",   # pydocstyle (docstring conventions)
  "E",   # pycodestyle errors (style basics)
  "F",   # pyflakes (unused imports, undefined names)
  "I",   # isort (import sorting)
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify (simpler equivalent code)
  "UP",  # pyupgrade (modern Python syntax)
  "W",   # pycodestyle warnings
]
lint.per-file-ignores."tests/**/*.py" = [ "D100", "D103" ]  # test modules/functions don't need docstrings
lint.pydocstyle.convention = "google"

[tool.pyright]
pythonVersion = "3.11"
venv = ".venv"
venvPath = "."
typeCheckingMode = "standard"
include = [ "src", "tests" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "-ra", "--strict-markers", "--strict-config", "--import-mode=importlib" ]
